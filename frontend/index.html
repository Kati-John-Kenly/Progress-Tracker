<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="98x95" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="239x243" href="/pwa-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Progress" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Progress • Personal Productivity & Habit Tracker</title>
    <style>
      :root {
        --app-font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      *, *::before, *::after, html, body, button, input, select, textarea {
        font-family: var(--app-font-sans) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.022em;
      }
      body {
        letter-spacing: -0.011em;
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('appTheme') || 'dark';
          var isLight = theme === 'light';
          document.documentElement.classList.toggle('light-theme', isLight);
          document.documentElement.setAttribute('data-theme', theme);
          if (document.body) {
            document.body.classList.toggle('light-theme', isLight);
            document.body.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
